<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%" fill="none">
  <!-- Architectural Geometric Monogram -->
  <g transform="translate(10, 10)">
    <!-- Outer Diamond / Hexagonal Emblem -->
    <path d="M50 0 L100 28.87 L100 86.6 L50 115.47 L0 86.6 L0 28.87 Z" stroke="#f3f1ea" stroke-width="2.5" fill="rgba(255, 255, 255, 0.03)" stroke-linejoin="round" />
    <path d="M50 10 L90 33 L90 82 L50 105 L10 82 L10 33 Z" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" stroke-dasharray="3 3" />
    <!-- Stylized Geometric "R" & "C" Emblem -->
    <path d="M36 32 L36 84 M36 32 L56 32 C65 32 71 37 71 46 C71 55 65 60 56 60 L36 60 M54 60 L72 84" stroke="#ff3b1d" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M72 40 C78 46 80 54 80 62 C80 74 72 82 60 84" stroke="#f3f1ea" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Corporate Typography -->
  <g transform="translate(135, 30)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f3f1ea" letter-spacing="3.5">
      RAW <tspan fill="#ff3b1d">CORP</tspan>
    </text>
    <text x="0" y="54" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#807f78" letter-spacing="2.2">
      LEATHER MANUFACTURING &amp; EXPORT
    </text>
    <text x="0" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="rgba(255, 255, 255, 0.35)" letter-spacing="1.5">
      EST. DHAKA • INDUSTRIAL PARTNER
    </text>
  </g>
</svg>
